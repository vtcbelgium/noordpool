name: Publiceer Noordpool op GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v6

      - name: Node.js instellen
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Three.js installeren
        run: npm ci

      - name: JavaScript controleren
        run: node scripts/check.mjs

      - name: Statische website bouwen
        run: node scripts/build.mjs

      - name: GitHub Pages voorbereiden
        uses: actions/configure-pages@v6

      - name: Website klaarzetten
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v5
